  <body>
    <h2>Registration form</h2>
    <div class="container" </div>
      <form action="" method="get">
        <table border="1">
          <tr>
            <td>name</td>
            <td><input type="text" name="name" placeholder="enter the name" required></td>
          </tr>
          <tr>
            <td>age</td>
            <td><input type="text" name="age" placeholder="age" required>
          </tr>
          <tr>
            <td>email id</td>
            <td><input type="text" name="emailid" placeholder="email id" required></td>
          </tr>
          <tr>
            <td>password</td>
            <td><input type="text" name="password" placeholder="********" required></td>
          </tr>
          <tr>
            <td>gender</td>
            <td>
              <input type="radio" name="gender" value="male" required>male
              <input type="radio" name="gender" value="female">female
            </td>
          </tr>
          <tr>
            <td>hobbies</td>
            <td>
              <input type="checkbox" name="hobbies" value="reading">reading
              <input type="checkbox" name="hobbies" value="writing">writing
            </td>
          </tr>
          <tr>
            <td>date of birth</td>
            <td><input type="date" value="date of birth"></td>
          </tr>
          <tr>
            <td>favorite color</td>
            <td><input type="color" value="favorite color"></td>
          </tr>
          <tr>
            <td>range</td>
            <td><input type="range" min="0" max="100"></td>
          </tr>
          <tr>
            <td>city</td>
            <td>
              <select name="city">
                <option value="">--select city--</option>
                <option>chennai</option>
                <option>dindigul</option>
                <option> trichy</option>
              </select>
            </td>
          </tr>
          <tr>
            <td colspan="2" align="center">
              <input type="submit" value="submit">
              <input type="reset" value="reset">
            </td>
          </tr>
        </table>
      </form>
