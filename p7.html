<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aadhaar Card Design</title>

    <style>
        body{
            background:#eaeaea;
            font-family: Arial, sans-serif;
        }

        .card{
            width: 420px;
            background: white;
            margin: 40px auto;
            border: 1px solid #999;
        }

        
        .header{
            text-align: center;
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        .header h3{
            margin: 0;
            color: #ff6600;
        }

        .header p{
            margin: 0;
            font-size: 12px;
        }

        
        .content{
            display: flex;
            padding: 10px;
        }

        .photo{
            width: 30%;
            text-align: center;
        }

        .photo img{
            width: 90px;
            height: 110px;
            border: 1px solid #000;
        }

        .details{
            width: 70%;
            font-size: 14px;
            padding-left: 10px;
        }

        .details p{
            margin: 4px 0;
        }

        
        .number{
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 8px;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }

        
        .footer{
            text-align: center;
            font-size: 12px;
            padding: 6px;
        }
    </style>
</head>

<body>

<div class="card">

    
    <div class="header">
        <h3>Government of India</h3>
        <p>Unique Identification Authority of India</p>
    </div>

    
    <div class="content">
        <div class="photo">
            <img src="https://i.pinimg.com/1200x/24/73/f0/2473f09bf619081b4382f55c84a934a5.jpg">
        </div>

        <div class="details">
            <p><b>Name:</b> Mathar Chikkandar</p>
            <p><b>DOB:</b> 01-01-1996</p>
            <p><b>Gender:</b> Male</p>
            <p><b>Address:</b> Chennai, Tamil Nadu</p>
        </div>
    </div>


    <div class="number">
        1234 5678 9012
    </div>

    <div class="footer">
        <p>My Aadhaar, My Identity</p>
    </div>

</div>

</body>
</html>
